<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Animales - Salvando Huellas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>

<body class="pagina-perfil">

    <!-- CABECERA -->
    <header class="cabecera-perfil">
        <div class="interior-cabecera">
            <a href="index.html" class="marca">Salvando Huellas</a>
            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="animales.html" aria-current="page">Animales</a>
                <a href="perfil.html">Mi perfil</a>
                <a href="usuarios.html" id="enlaceUsuarios" hidden>Usuarios</a>
                <button type="button" id="botonCerrarSesion">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-perfil">

        <div class="titulo-perfil">
            <span>ADMINISTRACIÓN</span>
            <h1>Consulta y Fichas de Animales</h1>
            <p>Filtra y localiza la información técnica de los animales registrados.</p>
        </div>

        <p id="mensajeAnimal" role="status"></p>

        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <form id="formularioFiltros">
            <div>
                <label for="buscarTexto">Búsqueda</label>
                <input type="text" id="buscarTexto" placeholder="Nombre o raza...">
            </div>

            <div>
                <label for="filtroEspecie">Especie</label>
                <select id="filtroEspecie">
                    <option value="">Todas</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div>
                <label for="filtroEstado">Estado</label>
                <select id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="Disponible">Disponible</option>
                    <option value="En acogida">En acogida</option>
                    <option value="Adoptado">Adoptado</option>
                </select>
            </div>

            <button type="submit" id="botonFiltrar">Filtrar</button>
            <button type="button" id="botonLimpiarFiltros">Limpiar</button>
        </form>

        <!-- TABLA DE RESULTADOS -->
        <div class="tabla-usuarios">
            <table>
                <caption>Animales registrados</caption>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Raza</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpoAnimales">
                    <!-- Las filas se generan con animales.js -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- MODAL DE DETALLE / FICHA COMPLETA -->
    <dialog id="modalDetalleAnimal" class="modal-acceso modal-detalle">
        <button type="button" id="cerrarDetalleAnimal" class="cerrar-modal">×</button>
        <div class="detalle-animal-body" id="contenidoFichaAnimal">
            <!-- Datos cargados dinámicamente -->
        </div>
    </dialog>

    <script type="module" src="/src/animales.js"></script>
</body>
</html>
