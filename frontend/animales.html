<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animales - Patas y Bigotes</title>

    <!-- TIPOGRAFIA CORPORATIVA -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="src/style.css">
</head>

<body class="pagina-perfil">

    <!-- CABECERA SUPERIOR -->
    <header class="cabecera-perfil">
        <div class="interior-cabecera">
            <a href="index.html" class="marca">
                Patas y Bigotes
            </a>

            <nav aria-label="Navegación principal">
                <a href="index.html">
                    Inicio
                </a>

                <a href="animales.html" aria-current="page">
                    Animales
                </a>

                <a href="perfil.html">
                    Mi perfil
                </a>

                <button type="button" id="botonCerrarSesion">
                    Cerrar sesión
                </button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO CON LA MISMA ESTRUCTURA QUE MI PERFIL -->
    <main class="contenido-perfil">

        <!-- TÍTULO DE SECCIÓN -->
        <div class="titulo-perfil">
            <span>ADMINISTRACIÓN</span>
            <h1>Alta / edición de animal</h1>
            <p>Introduce o modifica la información del animal en la protectora.</p>
        </div>

        <p id="mensajeAnimal" role="status"></p>

        <!-- DISTRIBUCIÓN EN 2 COLUMNAS IGUAL QUE EN MI PERFIL -->
        <div class="distribucion-perfil">

            <!-- TARJETA IZQUIERDA -->
            <aside class="resumen-perfil">
                <div class="avatar-perfil">
                    🐾
                </div>

                <h2>Gestión de Animales</h2>

                <span>
                    Un espacio para registrar y mantener al día las fichas de los animales.
                </span>
            </aside>

            <!-- TARJETA DERECHA CON EL FORMULARIO COMPLETO -->
            <section class="informacion-perfil">

                <h2>Datos del animal</h2>

                <form id="formularioAnimal" enctype="multipart/form-data">

                    <!-- NOMBRE -->
                    <label for="nombreAnimal">Nombre</label>
                    <input type="text" id="nombreAnimal" name="nombre" placeholder="Nombre" required>

                    <!-- FOTOGRAFÍA -->
                    <label for="fotografiaAnimal">Fotografía</label>
                    <input type="file" id="fotografiaAnimal" name="imagen" accept="image/*">

                    <!-- ESPECIE -->
                    <label for="especieAnimal">Especie</label>
                    <select id="especieAnimal" name="especie">
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>

                    <!-- RAZA -->
                    <label for="razaAnimal">Raza / características</label>
                    <input type="text" id="razaAnimal" name="raza" placeholder="Raza / características">

                    <!-- FECHA DE NACIMIENTO -->
                    <label for="nacimientoAnimal">Nacimiento aproximado</label>
                    <input type="date" id="nacimientoAnimal" name="fecha_nacimiento">

                    <!-- SEXO -->
                    <label for="sexoAnimal">Sexo</label>
                    <select id="sexoAnimal" name="sexo">
                        <option value="Hembra">Hembra</option>
                        <option value="Macho">Macho</option>
                    </select>

                    <!-- TAMAÑO -->
                    <label for="tamanoAnimal">Tamaño</label>
                    <select id="tamanoAnimal" name="tamano">
                        <option value="Pequeño">Pequeño</option>
                        <option value="Mediano">Mediano</option>
                        <option value="Grande">Grande</option>
                    </select>

                    <!-- PESO -->
                    <label for="pesoAnimal">Peso (kg)</label>
                    <input type="number" step="0.1" id="pesoAnimal" name="peso" placeholder="Peso (kg)">

                    <!-- FECHA DE ENTRADA -->
                    <label for="fechaEntradaAnimal">Fecha de entrada</label>
                    <input type="date" id="fechaEntradaAnimal" name="fecha_entrada">

                    <!-- MOTIVO -->
                    <label for="motivoAnimal">Motivo y procedencia</label>
                    <input type="text" id="motivoAnimal" name="motivo" placeholder="Motivo y procedencia">

                    <!-- ESTADO -->
                    <label for="estadoAnimal">Estado</label>
                    <select id="estadoAnimal" name="estado">
                        <option value="En acogida">En acogida</option>
                        <option value="Disponible">Disponible</option>
                        <option value="Adoptado">Adoptado</option>
                    </select>

                    <!-- CARÁCTER -->
                    <label for="caracterAnimal">Carácter</label>
                    <textarea id="caracterAnimal" name="caracter" placeholder="Escribe aquí..."></textarea>

                    <!-- COMPATIBILIDAD NIÑOS -->
                    <label for="conNinosAnimal">Con niños</label>
                    <select id="conNinosAnimal" name="con_ninos">
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>

                    <!-- COMPATIBILIDAD OTROS ANIMALES -->
                    <label for="conOtrosAnimales">Con otros animales</label>
                    <select id="conOtrosAnimales" name="con_otros_animales">
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>

                    <!-- COMPATIBILIDAD DESCONOCIDOS -->
                    <label for="conDesconocidos">Con desconocidos</label>
                    <select id="conDesconocidos" name="con_desconocidos">
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>

                    <!-- NECESIDADES ESPECIALES -->
                    <label for="necesidadesEspeciales">Necesidades especiales</label>
                    <textarea id="necesidadesEspeciales" name="necesidades_especiales" placeholder="Escribe aquí..."></textarea>

                    <!-- OBSERVACIONES -->
                    <label for="observacionesAnimal">Observaciones del personal</label>
                    <textarea id="observacionesAnimal" name="observaciones" placeholder="Escribe aquí..."></textarea>

                    <!-- BOTÓN DE GUARDADO CON LA MISMA CLASE DEL SISTEMA -->
                    <button type="submit" id="botonGuardarPerfil" style="margin-top: 20px; width: 100%;">
                        Guardar animal
                    </button>

                </form>

            </section>

        </div>

    </main>

    <script type="module" src="/src/animales.js"></script>

</body>

</html>
