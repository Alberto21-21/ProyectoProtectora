<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Animales - Salvando Huellas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>

<body class="pagina-perfil">

    <!-- CABECERA -->
    <header class="cabecera-perfil">
        <div class="interior-cabecera">
            <a href="index.html" class="marca">Salvando Huellas</a>
            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="animales.html" aria-current="page">Animales</a>
                <a href="perfil.html">Mi perfil</a>
                <a href="usuarios.html" id="enlaceUsuarios" hidden>Usuarios</a>
                <button type="button" id="botonCerrarSesion">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-perfil">

        <div class="titulo-perfil">
            <span>ADMINISTRACIÓN</span>
            <h1>Gestión y Consulta de Animales</h1>
            <p>Registra nuevos animales o filtra y localiza la información técnica de los ya existentes.</p>
        </div>

        <p id="mensajeAnimal" role="status"></p>

        <!-- SECCIÓN DE ALTA DE ANIMAL -->
        <div id="gestionAnimales" class="distribucion-perfil">

            <!-- TARJETA IZQUIERDA -->
            <aside class="resumen-perfil">
                <div class="avatar-perfil">
                    🐾
                </div>

                <h2>Alta de Animales</h2>

                <span>
                    Un espacio para registrar la llegada de los animales a la protectora.
                </span>
            </aside>

            <!-- TARJETA DERECHA CON EL FORMULARIO COMPLETO -->
            <section class="informacion-perfil">

                <h2>Datos del animal</h2>

                <form id="formularioAnimal">

                    <!-- NOMBRE -->
                    <label for="nombreAnimal">Nombre *</label>
                    <input type="text" id="nombreAnimal" name="nombre" placeholder="Nombre" maxlength="255" required>
                    <p class="error-campo" id="error-nombre"></p>

                    <!-- FOTOGRAFÍA -->
                    <label for="fotografiaAnimal">Fotografía</label>
                    <input type="file" id="fotografiaAnimal" name="fotografia" accept="image/jpeg,image/png,image/webp">
                    <p class="error-campo" id="error-fotografia"></p>

                    <!-- ESPECIE -->
                    <label for="especieAnimal">Especie *</label>
                    <select id="especieAnimal" name="especie" required>
                        <option value="">Selecciona una especie</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <p class="error-campo" id="error-especie"></p>

                    <!-- RAZA -->
                    <label for="razaAnimal">Raza / características</label>
                    <input type="text" id="razaAnimal" name="raza" placeholder="Raza / características" maxlength="255">
                    <p class="error-campo" id="error-raza"></p>

                    <!-- FECHA DE NACIMIENTO -->
                    <label for="nacimientoAnimal">Nacimiento aproximado</label>
                    <input type="date" id="nacimientoAnimal" name="fecha_nacimiento">
                    <p class="error-campo" id="error-fecha_nacimiento"></p>

                    <!-- SEXO -->
                    <label for="sexoAnimal">Sexo *</label>
                    <select id="sexoAnimal" name="sexo" required>
                        <option value="">Selecciona el sexo</option>
                        <option value="Hembra">Hembra</option>
                        <option value="Macho">Macho</option>
                    </select>
                    <p class="error-campo" id="error-sexo"></p>

                    <!-- TAMAÑO -->
                    <label for="tamanoAnimal">Tamaño *</label>
                    <select id="tamanoAnimal" name="tamano" required>
                        <option value="">Selecciona el tamaño</option>
                        <option value="Pequeño">Pequeño</option>
                        <option value="Mediano">Mediano</option>
                        <option value="Grande">Grande</option>
                    </select>
                    <p class="error-campo" id="error-
