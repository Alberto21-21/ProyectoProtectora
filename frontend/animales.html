<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Animal - Salvando Huellas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>

<body class="pagina-perfil">

    <!-- CABECERA -->
    <header class="cabecera-perfil">
        <div class="interior-cabecera">
            <a href="index.html" class="marca">Salvando Huellas</a>
            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="animales.html" aria-current="page">Animales</a>
                <a href="perfil.html">Mi perfil</a>
                <a href="usuarios.html" id="enlaceUsuarios" hidden>Usuarios</a>
                <button type="button" id="botonCerrarSesion">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-perfil">

        <div class="titulo-perfil">
            <span>ADMINISTRACIÓN</span>
            <h1>Alta de Animal</h1>
            <p>Registra la llegada de un nuevo animal en la base de datos de la protectora.</p>
        </div>

        <p id="mensajeAnimal" role="status"></p>

        <!-- SECCIÓN DE ALTA DE ANIMAL -->
        <div id="gestionAnimales" class="distribucion-perfil" hidden>

            <!-- TARJETA IZQUIERDA -->
            <aside class="resumen-perfil">
                <div class="avatar-perfil">
                    🐾
                </div>

                <h2>Alta de Animales</h2>

                <span>
                    Un espacio para registrar la llegada de los animales a la protectora.
                </span>
            </aside>

            <!-- TARJETA DERECHA CON EL FORMULARIO COMPLETO -->
            <section class="informacion-perfil">

                <h2>Datos del animal</h2>

                <form id="formularioAnimal" enctype="multipart/form-data">

                    <!-- NOMBRE -->
                    <label for="nombreAnimal">Nombre *</label>
                    <input type="text" id="nombreAnimal" name="nombre" placeholder="Nombre" maxlength="255" required>
                    <p class="error-campo" id="error-nombre"></p>

                    <!-- FOTOGRAFÍA -->
                    <label for="fotografiaAnimal">Fotografía</label>
                    <input type="file" id="fotografiaAnimal" name="fotografia" accept="image/jpeg,image/png,image/webp">
                    <p class="error-campo" id="error-fotografia"></p>

                    <!-- ESPECIE -->
                    <label for="especieAnimal">Especie *</label>
                    <select id="especieAnimal" name="especie" required>
                        <option value="">Selecciona una especie</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <p class="error-campo" id="error-especie"></p>

                    <!-- RAZA -->
                    <label for="razaAnimal">Raza / características</label>
                    <input type="text" id="razaAnimal" name="raza" placeholder="Raza / características" maxlength="255">
                    <p class="error-campo" id="error-raza"></p>

                    <!-- FECHA DE NACIMIENTO -->
                    <label for="nacimientoAnimal">Nacimiento aproximado</label>
                    <input type="date" id="nacimientoAnimal" name="fecha_nacimiento">
                    <p class="error-campo" id="error-fecha_nacimiento"></p>

                    <!-- SEXO -->
                    <label for="sexoAnimal">Sexo *</label>
                    <select id="sexoAnimal" name="sexo" required>
                        <option value="">Selecciona el sexo</option>
                        <option value="Hembra">Hembra</option>
                        <option value="Macho">Macho</option>
                    </select>
                    <p class="error-campo" id="error-sexo"></p>

                    <!-- TAMAÑO -->
                    <label for="tamanoAnimal">Tamaño *</label>
                    <select id="tamanoAnimal" name="tamano" required>
                        <option value="">Selecciona el tamaño</option>
                        <option value="Pequeño">Pequeño</option>
                        <option value="Mediano">Mediano</option>
                        <option value="Grande">Grande</option>
                    </select>
                    <p class="error-campo" id="error-tamano"></p>

                    <!-- PESO -->
                    <label for="pesoAnimal">Peso (kg)</label>
                    <input type="number" id="pesoAnimal" name="peso" placeholder="Ej. 15.5" min="0" max="999" step="0.01">
                    <p class="error-campo" id="error-peso"></p>

                    <!-- FECHA DE ENTRADA -->
                    <label for="fechaEntradaAnimal">Fecha de entrada *</label>
                    <input type="date" id="fechaEntradaAnimal" name="fecha_entrada" required>
                    <p class="error-campo" id="error-fecha_entrada"></p>

                    <!-- MOTIVO -->
                    <label for="motivoAnimal">Motivo / procedencia *</label>
                    <input type="text" id="motivoAnimal" name="motivo" placeholder="Abandono, rescate..." maxlength="255" required>
                    <p class="error-campo" id="error-motivo"></p>

                    <!-- ESTADO -->
                    <label for="estadoAnimal">Estado inicial *</label>
                    <select id="estadoAnimal" name="estado" required>
                        <option value="En acogida">En acogida</option>
                        <option value="En tratamiento">En tratamiento</option>
                        <option value="Disponible">Disponible</option>
                        <option value="Reservado">Reservado</option>
                        <option value="Adoptado">Adoptado</option>
                    </select>
                    <p class="error-campo" id="error-estado"></p>

                    <!-- CARÁCTER -->
                    <label for="caracterAnimal">Carácter</label>
                    <input type="text" id="caracterAnimal" name="caracter" placeholder="Cariñoso, juguetón..." maxlength="1000">
                    <p class="error-campo" id="error-caracter"></p>

                    <!-- COMPATIBILIDAD CON NIÑOS -->
                    <label for="conNinosAnimal">Compatibilidad con niños *</label>
                    <select id="conNinosAnimal" name="con_ninos" required>
                        <option value="Desconocido">Desconocido</option>
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>
                    <p class="error-campo" id="error-con_ninos"></p>

                    <!-- COMPATIBILIDAD CON OTROS ANIMALES -->
                    <label for="conOtrosAnimales">Compatibilidad con otros animales *</label>
                    <select id="conOtrosAnimales" name="con_otros_animales" required>
                        <option value="Desconocido">Desconocido</option>
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>
                    <p class="error-campo" id="error-con_otros_animales"></p>

                    <!-- COMPATIBILIDAD CON DESCONOCIDOS -->
                    <label for="conDesconocidosAnimal">Compatibilidad con desconocidos *</label>
                    <select id="conDesconocidosAnimal" name="con_desconocidos" required>
                        <option value="Desconocido">Desconocido</option>
                        <option value="Compatible">Compatible</option>
                        <option value="No compatible">No compatible</option>
                    </select>
                    <p class="error-campo" id="error-con_desconocidos"></p>

                    <!-- NECESIDADES ESPECIALES -->
                    <label for="necesidadesAnimal">Necesidades especiales</label>
                    <textarea id="necesidadesAnimal" name="necesidades_especiales" rows="3" maxlength="1000" placeholder="Medicación, alimentación especial..."></textarea>
                    <p class="error-campo" id="error-necesidades_especiales"></p>

                    <!-- OBSERVACIONES -->
                    <label for="observacionesAnimal">Observaciones</label>
                    <textarea id="observacionesAnimal" name="observaciones" rows="3" maxlength="1000" placeholder="Notas internas del personal..."></textarea>
                    <p class="error-campo" id="error-observaciones"></p>

                    <!-- BOTÓN GUARDAR -->
                    <button type="submit" id="botonGuardarAnimal">Guardar animal</button>

                </form>

            </section>
        </div>

    </main>

    <script type="module" src="./src/animales.js"></script>
</body>

</html>
