<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil - Salvando Huellas</title>

    <!-- TIPOGRAFIA CORPORATIVA -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="src/style.css">
</head>

<body class="pagina-perfil">

    <!-- CABECERA -->
    <header class="cabecera-perfil">

        <div class="interior-cabecera">

            <a href="index.html" class="marca">
                Salvando Huellas
            </a>

            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>

                <a href="animales.html">
                Animales
                </a>

                <a href="perfil.html" aria-current="page">
                    Mi perfil
                </a>



                <button type="button" id="botonCerrarSesion">
                    Cerrar sesión
                </button>
            </nav>

        </div>

    </header>

    <!-- CONTENIDO DEL PERFIL -->
    <main class="contenido-perfil">

        <!-- PRESENTACION -->
        <div class="titulo-perfil">

            <span>MI CUENTA</span>

            <h1>Mi perfil</h1>

            <p>Consulta los datos de tu cuenta en Patas y Bigotes.</p>

        </div>

        <!-- MENSAJES -->
        <p id="mensajePerfil" role="status"></p>

        <!-- INFORMACION AUTORIZADA DEL USUARIO -->
        <div id="datosPerfil" class="distribucion-perfil" hidden>

            <!-- RESUMEN LATERAL -->
            <aside class="resumen-perfil">

                <div class="avatar-perfil" id="avatarPredeterminado" aria-hidden="true">
                    🐾
                </div>

                <img
                    id="fotografiaPerfil"
                    alt="Fotografía de mi perfil"
                    hidden
                >

                <h2>Tu cuenta</h2>

                <span>
                    Un espacio para consultar tu información personal.
                </span>

                <!-- CAMBIAR LA FOTOGRAFÍA DEL PERFIL -->
                <form id="formularioFotografia">

                    <label for="fotografiaEditar" class="seleccionar-fotografia">
                        Seleccionar fotografía
                    </label>

                    <input
                        type="file"
                        id="fotografiaEditar"
                        name="fotografia"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                    <p id="mensajeFotografia" role="status"></p>

                    <button type="submit" id="botonGuardarFotografia">
                        Guardar fotografía
                    </button>

                </form>

            </aside>

            <!-- DATOS PERSONALES -->
            <section class="informacion-perfil">

                <h2>Información personal</h2>

                <dl class="lista-datos-perfil">

                    <div class="dato-perfil">
                        <dt>Nombre</dt>
                        <dd id="nombrePerfil"></dd>
                    </div>

                    <div class="dato-perfil">
                        <dt>Correo electrónico</dt>
                        <dd id="emailPerfil"></dd>
                    </div>

                    <div class="dato-perfil">
                        <dt>Fecha de nacimiento</dt>
                        <dd id="fechaNacimientoPerfil"></dd>
                    </div>

                    <div class="dato-perfil">
                        <dt>Rol</dt>
                        <dd id="rolPerfil"></dd>
                    </div>

                </dl>

                <!-- FORMULARIO PARA EDITAR EL PERFIL -->
                <form id="formularioEditarPerfil">

                    <h2>Editar mis datos</h2>

                    <label for="nombreEditar">Nombre</label>
                    <input
                        type="text"
                        id="nombreEditar"
                        name="name"
                        autocomplete="name"
                        maxlength="255"
                        required
                    >

                    <label for="emailEditar">Correo electrónico</label>
                    <input
                        type="email"
                        id="emailEditar"
                        name="email"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >

                    <label for="fechaNacimientoEditar">Fecha de nacimiento</label>
                    <input
                        type="date"
                        id="fechaNacimientoEditar"
                        name="fecha_nacimiento"
                        autocomplete="bday"
                        required
                    >

                    <p id="mensajeEditarPerfil" role="status"></p>

                    <button type="submit" id="botonGuardarPerfil">
                        Guardar cambios
                    </button>

                </form>

                <!-- FORMULARIO PARA CAMBIAR LA CONTRASEÑA -->
                <form id="formularioContrasena">

                    <h2>Cambiar contraseña</h2>

                    <label for="passwordActual">Contraseña actual</label>
                    <input
                        type="password"
                        id="passwordActual"
                        name="password_actual"
                        autocomplete="current-password"
                        required
                    >

                    <label for="passwordNueva">Nueva contraseña</label>
                    <input
                        type="password"
                        id="passwordNueva"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <label for="confirmarPasswordNueva">
                        Repite la nueva contraseña
                    </label>
                    <input
                        type="password"
                        id="confirmarPasswordNueva"
                        name="password_confirmation"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <p id="mensajeContrasena" role="status"></p>

                    <button type="submit" id="botonGuardarContrasena">
                        Cambiar contraseña
                    </button>

                </form>
            </section>

        </div>

    </main>

    <script type="module" src="/src/perfil.js"></script>

</body>

</html>
